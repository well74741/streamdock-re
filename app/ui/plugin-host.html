<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>M18 插件宿主</title>
</head>
<body>
<!--
  后台无头浏览器打开的页面：
  1) 用 iframe 加载网页类插件，并调用插件页里的 connectElgatoStreamDeckSocket 完成注册；
  2) 把插件发来的 SVG 画成 PNG（Python 端的 Pillow 不会画 SVG）。
-->
<script>
const params = new URLSearchParams(location.search);
const port = params.get("ws");
const hostToken = params.get("token") || "";
const frames = new Map();
let ws = null;
let lastItems = [];
let lastPort = null;

function log(message) {
  try { ws && ws.readyState === 1 && ws.send(JSON.stringify({ event: "log", message: String(message) })); } catch (_) { /* ignore */ }
}

function connect() {
  ws = new WebSocket(`ws://127.0.0.1:${port}`);
  ws.onopen = () => ws.send(JSON.stringify({ event: "registerHost", token: hostToken }));
  ws.onmessage = (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.event === "plugins") { lastItems = m.items || []; lastPort = m.port; syncPlugins(lastItems, lastPort); }
    else if (m.event === "reload") {
      const f = frames.get(m.uuid);
      if (f) { f.remove(); frames.delete(m.uuid); }
      syncPlugins(lastItems, lastPort);
      log(`${m.uuid}：已热重载`);
    }
    else if (m.event === "rasterize") rasterize(m);
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

function syncPlugins(items, wsPort) {
  // it.id 是插件真实 id（用来对应 iframe / 写日志），it.uuid 是注册令牌（只交给插件自己）
  const want = new Set(items.map((i) => i.id));
  for (const [uuid, f] of frames) {
    if (!want.has(uuid)) { f.remove(); frames.delete(uuid); }
  }
  for (const it of items) {
    if (frames.has(it.id)) continue;
    const f = document.createElement("iframe");
    f.style.cssText = "width:320px;height:240px;border:0";
    f.addEventListener("load", () => {
      if (f.dataset.registered) return;           // 插件页内部跳转不重复注册
      const w = f.contentWindow;
      const fn = w && (w.connectElgatoStreamDeckSocket || w.connectSocket);
      if (typeof fn !== "function") {
        log(`${it.id}：插件页没有 connectElgatoStreamDeckSocket`);
        return;
      }
      try {
        fn.call(w, wsPort, it.uuid, "registerPlugin", it.info);
        f.dataset.registered = "1";
        log(`${it.id}：网页插件已加载`);
        try {
          // 插件靠 window.open 弹便签 / 待办窗口。后台宿主窗口在屏幕外，
          // 直接弹会被 Edge 并成宿主窗口里的一个标签页（用户看不到）；
          // 这里改由宿主页开一个真正的弹窗窗口，插件拿到的仍是一个窗口对象。
          w.open = (url, name, feat) => {
            let abs = url;
            try { abs = new URL(url, w.location.href).href; } catch (_) { /* 保持原样 */ }
            log(`${it.id}：打开弹窗 ${abs}`);
            const wpx = 620, hpx = 700;
            const left = Math.max(0, Math.round((screen.availWidth - wpx) / 2));
            const top = Math.max(0, Math.round((screen.availHeight - hpx) / 2));
            return window.open(abs, "_blank",
              `popup=1,width=${wpx},height=${hpx},left=${left},top=${top}`);
          };
        } catch (e) { log(`${it.id}：接管弹窗失败 ${e}`); }
      } catch (e) {
        log(`${it.id}：注册出错 ${e}`);
      }
    });
    f.src = it.url;
    document.body.appendChild(f);
    frames.set(it.id, f);
  }
}

async function rasterize(m) {
  try {
    const img = new Image();
    img.src = m.image;
    await img.decode();
    const size = m.size || 144;
    const c = document.createElement("canvas");
    c.width = c.height = size;
    c.getContext("2d").drawImage(img, 0, 0, size, size);
    ws.send(JSON.stringify({ event: "rasterized", id: m.id, image: c.toDataURL("image/png") }));
  } catch (e) {
    log(`SVG 转换失败：${e}`);
  }
}

connect();
</script>
</body>
</html>
